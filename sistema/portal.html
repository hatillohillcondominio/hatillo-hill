<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f4f2ee">
<title>Hatillo Hill · Mi apartamento</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o" crossorigin="anonymous"></script>
<style>
  :root{
    --bg:#f4f2ee; --panel:#faf8f3; --panel2:#efece4; --border:#d6cdb9;
    --text:#2b2a28; --sub:#645d51; --dim:#8a8476; --accent:#b8862c;
    --green:#4f8f6a; --amber:#c9772f; --red:#c1503f; --blue:#3b78b5;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-text-size-adjust:100%;}
  body{min-height:100vh;}
  button,input,select,textarea{font:inherit;color:inherit;}
  .wrap{max-width:560px;margin:0 auto;padding:16px 16px 40px;}

  header{display:flex;align-items:center;gap:10px;padding:4px 0 14px;}
  header img{height:34px;width:auto;}
  header .t{flex:1;min-width:0;}
  header .t b{display:block;font-size:16px;}
  header .t span{font-size:12.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;}
  .menuBtn{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:7px 10px;font-size:13px;cursor:pointer;}

  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px;}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--sub);margin:22px 4px 8px;font-weight:700;}

  .saldo{text-align:center;padding:22px 16px;}
  .saldo .lbl{font-size:13px;color:var(--sub);}
  .saldo .monto{font-size:38px;font-weight:800;margin:4px 0 2px;font-variant-numeric:tabular-nums;letter-spacing:-.5px;}
  .saldo .det{font-size:13px;color:var(--sub);margin-bottom:16px;}
  .saldo.aldia .monto{color:var(--green);}
  .aviso{border-color:var(--red);background:#fbefec;}
  .aviso .avTit{font-weight:800;color:var(--red);font-size:14px;margin-bottom:4px;}
  .aviso .avTxt{font-size:14px;line-height:1.45;margin-bottom:6px;}
  .aviso .avMonto{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;margin-bottom:6px;}
  .aviso .avMonto span{font-size:14px;color:var(--sub);font-weight:600;}
  .saldo .enbs{font-size:17px;font-weight:700;color:var(--sub);font-variant-numeric:tabular-nums;margin-bottom:4px;}
  .saldo.debe .monto{color:var(--red);}

  .btn{display:block;width:100%;border:none;border-radius:12px;padding:13px 16px;font-size:15px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff;}
  .btn.sec{background:var(--panel2);color:var(--text);border:1px solid var(--border);}
  .btn:disabled{opacity:.6;cursor:default;}

  .fila{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--panel2);}
  .fila:last-child{border-bottom:none;}
  .fila .q{flex:1;min-width:0;}
  .fila .q b{display:block;font-size:14.5px;font-weight:600;}
  .fila .q span{font-size:12.5px;color:var(--sub);}
  .fila .m{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;font-size:14.5px;}
  .fila .m small{display:block;font-weight:600;font-size:11.5px;}
  .fila.tap{cursor:pointer;}
  .fila.tap:active{background:var(--panel2);}
  .lista{padding:4px 12px;}
  .ok{color:var(--green);} .mal{color:var(--red);} .esp{color:var(--amber);}
  .vacio{color:var(--sub);font-size:13.5px;text-align:center;padding:18px 8px;}
  .nota{font-size:12.5px;color:var(--sub);line-height:1.5;}

  label{display:block;font-size:12.5px;color:var(--sub);margin:12px 0 4px;font-weight:600;}
  input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:10px;background:#fff;font-size:16px;}
  textarea{min-height:64px;resize:vertical;}
  .error{color:var(--red);font-size:13px;margin-top:10px;min-height:1em;}

  .pago-datos{white-space:pre-wrap;font-size:13.5px;line-height:1.55;background:var(--panel2);border-radius:10px;padding:10px 12px;margin-bottom:6px;}

  .login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;}
  .login .card{width:100%;max-width:380px;padding:26px 22px;}
  .login img{height:64px;display:block;margin:0 auto 10px;}
  .login h1{font-size:18px;text-align:center;margin:0 0 2px;}
  .login p{font-size:13px;color:var(--sub);text-align:center;margin:0 0 8px;}

  /* hoja deslizante (formularios y recibo) */
  .hoja{position:fixed;inset:0;z-index:50;background:rgba(40,35,25,.45);display:none;align-items:flex-end;justify-content:center;}
  .hoja.open{display:flex;}
  .hoja .cont{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px 28px;}
  .hoja .barra{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
  .hoja .barra b{flex:1;font-size:16px;}
  .cerrar{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:7px 12px;cursor:pointer;font-size:13px;}

  .menuPop{position:absolute;right:16px;top:56px;background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:0 10px 30px rgba(60,50,30,.15);padding:6px;display:none;z-index:40;min-width:190px;}
  .menuPop.open{display:block;}
  .menuPop button{display:block;width:100%;text-align:left;background:none;border:none;padding:10px 12px;border-radius:8px;cursor:pointer;font-size:14px;}
  .menuPop button:hover{background:var(--panel2);}

  /* recibo: la misma hoja que imprime la junta */
  #reciboHoja{background:#fff;color:#222;padding:18px 16px;font-size:12.5px;border-radius:10px;border:1px solid var(--border);overflow-x:auto;}
  #reciboHoja .rcCab{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;border-bottom:2px solid #b8935a;padding-bottom:10px;margin-bottom:12px;flex-wrap:wrap;}
  #reciboHoja .rcTipo{font-size:15px;font-weight:800;text-align:right;}
  #reciboHoja .rcDatos{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;border:1px solid #999;border-radius:6px;padding:8px 10px;margin-bottom:12px;}
  #reciboHoja table{width:100%;border-collapse:collapse;margin-bottom:12px;font-variant-numeric:tabular-nums;}
  #reciboHoja th{background:#eee;border:1px solid #999;padding:5px 8px;text-align:left;font-size:11.5px;}
  #reciboHoja td{border-left:1px solid #999;border-right:1px solid #999;padding:3px 8px;}
  #reciboHoja tr:nth-child(even) td{background:#f6f6f6;}
  #reciboHoja td.n,#reciboHoja th.n{text-align:right;white-space:nowrap;}
  #reciboHoja tr.tot td{border:1px solid #999;font-weight:800;background:#eee;}
  #reciboHoja .rcPie{display:grid;grid-template-columns:repeat(2,1fr);border:1px solid #999;border-radius:6px;overflow:hidden;}
  #reciboHoja .rcPie div{padding:6px 8px;border-right:1px solid #999;border-bottom:1px solid #999;}
  #reciboHoja .rcPie b{display:block;font-size:10.5px;color:#555;text-transform:uppercase;}
  #reciboHoja .rcPie span{font-size:15px;font-weight:800;}
  @media (min-width:520px){
    #reciboHoja{padding:26px 28px;}
    #reciboHoja .rcPie{grid-template-columns:repeat(4,1fr);}
  }
  @media print{
    body *{visibility:hidden !important;}
    #reciboHoja, #reciboHoja *{visibility:visible !important;}
    #reciboHoja{position:absolute;left:0;top:0;width:100%;border:none;}
    #reciboHoja .rcPie{grid-template-columns:repeat(4,1fr);}
  }
</style>
</head>

const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ---------- utilidades ----------
function esc(s){
  return (s===null||s===undefined) ? '' : String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
const f2 = n=>(Number(n)||0).toLocaleString('es-VE', {minimumFractionDigits:2, maximumFractionDigits:2});
const usd = n=>'$' + f2(n);
const bs = n=>'Bs ' + f2(n);

// Tasa oficial del BCV. La publica ve.dolarapi.com (lee la pagina del BCV);
// si no responde, el portal sigue funcionando solo en dolares.
let tasa = null;   // {valor, fecha}
async function cargarTasa(){
  try{
    const ctl = new AbortController();
    const reloj = setTimeout(()=>ctl.abort(), 8000);
    const r = await fetch('https://ve.dolarapi.com/v1/dolares/oficial', {signal: ctl.signal, cache: 'no-store'});
    clearTimeout(reloj);
    const j = await r.json();
    const v = Number(j.promedio || j.venta || j.compra);
    tasa = v > 0 ? {valor: v, fecha: j.fechaActualizacion || null} : null;
  }catch(e){ tasa = null; }
}
const enBs = n=>tasa ? Math.round(Number(n) * tasa.valor * 100) / 100 : null;
function mesLegible(id){
  if(!id) return '';
  const [a, m] = id.split('-');
  const nombres = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  return nombres[parseInt(m,10)-1] + ' de ' + a;
}
const mesCorto = id=>{ const s = mesLegible(id); return s.charAt(0).toUpperCase() + s.slice(1); };
function fecha(s){
  if(!s) return '';
  const d = new Date(String(s).length === 10 ? s + 'T12:00:00' : s);
  return d.toLocaleDateString('es-VE', {day:'2-digit', month:'2-digit', year:'numeric'});
}
function hoy(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function abrirHoja(html){
  document.getElementById('hojaCont').innerHTML = html;
  document.getElementById('hoja').classList.add('open');
  document.querySelectorAll('#hojaCont [data-cerrar]').forEach(b=>b.onclick = cerrarHoja);
}
function cerrarHoja(){ document.getElementById('hoja').classList.remove('open'); }
document.getElementById('hoja').addEventListener('click', e=>{ if(e.target.id === 'hoja') cerrarHoja(); });

function pantallaLogin(msj){
  raiz.innerHTML = '<div class="login"><form class="card" id="fLogin">'
    + '<img src="' + LOGO + '" alt="Hatillo Hill">'
    + '<h1>Mi apartamento</h1><p>Conjunto Residencial Hatillo Hill</p>'
    + '<label for="lCorreo">Correo</label><input id="lCorreo" type="email" autocomplete="username" required>'
    + '<label for="lClave">Clave</label><input id="lClave" type="password" autocomplete="current-password" required>'
    + '<div class="error" id="lError">' + esc(msj || '') + '</div>'
    + '<button class="btn" id="lEntrar" style="margin-top:6px;">Entrar</button>'
    + '<p style="margin-top:14px;">¿No tienes usuario?<br>Pídela a la Junta de Condominio.</p>'
    + '</form></div>';
  document.getElementById('fLogin').onsubmit = async e=>{
    e.preventDefault();
    const b = document.getElementById('lEntrar');
    b.disabled = true; b.textContent = 'Entrando…';
    const { error } = await db.auth.signInWithPassword({
      email: document.getElementById('lCorreo').value.trim(),
      password: document.getElementById('lClave').value
    });
    if(error){
      b.disabled = false; b.textContent = 'Entrar';
      document.getElementById('lError').textContent = /invalid/i.test(error.message)
        ? 'Correo o clave incorrectos.'
        : 'No se pudo entrar: ' + error.message;
      return;
    }
    await arrancar();
  };
}

function pantallaAviso(titulo, texto, extra){
  raiz.innerHTML = '<div class="login"><div class="card">'
    + '<img src="' + LOGO + '" alt="Hatillo Hill"><h1>' + titulo + '</h1>'
    + '<p style="margin:10px 0 18px;">' + texto + '</p>' + (extra || '')
    + '<button class="btn sec" id="aSalir">Salir</button></div></div>';
  document.getElementById('aSalir').onclick = salir;
}

async function salir(){
  await db.auth.signOut();
  perfil = null; apt = null;
  pantallaLogin();
}

function pantallaCambioClave(obligatorio){
  const html = '<form id="fClave">'
    + (obligatorio
        ? '<p class="nota" style="margin:0 0 4px;">Es tu primera entrada. Elige una clave nueva que solo tú conozcas.</p>'
        : '')
    + '<label for="c1">Clave nueva (mínimo 8 caracteres)</label><input id="c1" type="password" autocomplete="new-password" minlength="8" required>'
    + '<label for="c2">Repítela</label><input id="c2" type="password" autocomplete="new-password" minlength="8" required>'
    + '<div class="error" id="cError"></div>'
    + '<button class="btn" id="cGuardar" style="margin-top:6px;">Guardar clave</button></form>';
  if(obligatorio){
    raiz.innerHTML = '<div class="login"><div class="card"><img src="' + LOGO + '" alt="Hatillo Hill"><h1>Elige tu clave</h1>' + html + '</div></div>';
  } else {
    abrirHoja('<div class="barra"><b>Cambiar mi clave</b><button class="cerrar" data-cerrar>✕</button></div>' + html);
  }
  document.getElementById('fClave').onsubmit = async e=>{
    e.preventDefault();
    const c1 = document.getElementById('c1').value, c2 = document.getElementById('c2').value;
    const err = document.getElementById('cError');
    if(c1.length < 8){ err.textContent = 'Debe tener al menos 8 caracteres.'; return; }
    if(c1 !== c2){ err.textContent = 'Las dos claves no coinciden.'; return; }
    const b = document.getElementById('cGuardar'); b.disabled = true;
    const { error } = await db.auth.updateUser({ password: c1 });
    if(error){
      b.disabled = false;
      err.textContent = /different|same/i.test(error.message)
        ? 'La clave nueva debe ser distinta de la anterior.'
        : 'No se pudo cambiar: ' + error.message;
      return;
    }
    await db.rpc('marcar_clave_cambiada');
    perfil.clave_temporal = false;
    if(obligatorio) await pintarInicio();
    else { cerrarHoja(); }
  };
}

async function arrancar(){
  const { data: { session } } = await db.auth.getSession();
  if(!session){ pantallaLogin(); return; }
  const { data, error } = await db.from('perfiles').select('*').eq('id', session.user.id).maybeSingle();
  if(error){ pantallaLogin('No se pudo leer tu usuario: ' + error.message); return; }
  perfil = data;
  if(!perfil || !perfil.activo){
    pantallaAviso('Usuario sin activar', 'Tu usuario existe pero la Junta aún no lo ha activado.');
    return;
  }
  if(perfil.rol !== 'vecino'){
    pantallaAviso('Usuario de la Junta', 'Este portal es para los propietarios. Tu usuario es de la Junta: entra por el sistema completo.',
      '<a class="btn" href="index.html" style="text-align:center;text-decoration:none;margin-bottom:10px;">Abrir el sistema</a>');
    return;
  }
  if(!perfil.apartamento_id){
    pantallaAviso('Falta tu apartamento', 'Tu usuario no tiene apartamento asignado. Avísale a la Junta.');
    return;
  }
  await pintarInicio();
}

// ---------- inicio ----------
let datos = {};

async function cargar(){
  const id = perfil.apartamento_id;
  const pTasa = cargarTasa();
  const [a, s, r, p, m, c, ap, cfg, fav] = await Promise.all([
    db.from('apartamentos').select('id, propietario, torre, piso').eq('id', id).maybeSingle(),
    db.from('v_saldo_apartamento').select('saldo, recibos_pendientes, recibo_mas_viejo').eq('apartamento_id', id).maybeSingle(),
    db.from('recibos').select('id, periodo_id, monto_total, vence_el').eq('apartamento_id', id).order('periodo_id', {ascending:false}),
    db.from('pagos').select('id, fecha, monto, forma_pago, banco, referencia, origen, estado, nota, creado_en').eq('apartamento_id', id).order('fecha', {ascending:false}).order('creado_en', {ascending:false}).limit(60),
    db.from('multas').select('id, fecha, articulos_label, descripcion, monto, estado, recibo_id').eq('apartamento_id', id).order('fecha', {ascending:false}),
    db.from('cargos').select('id, fecha, concepto, monto, recibo_id, anulado').eq('apartamento_id', id).is('recibo_id', null).eq('anulado', false),
    db.from('proyecto_aportes').select('id, monto_aporte, proyectos(nombre, activo), proyecto_abonos(fecha, monto, forma_pago)').eq('apartamento_id', id),
    db.from('configuracion').select('valor').eq('clave', 'datos_pago_portal').maybeSingle(),
    db.from('v_saldo_favor').select('a_favor').eq('apartamento_id', id).maybeSingle()
  ]);
  const falla = [a, s, r, p].find(x=>x.error);
  if(falla) throw new Error(falla.error.message);
  apt = a.data || {id};
  const recibos = r.data || [];
  const ids = recibos.map(x=>x.id);
  const apl = ids.length ? await db.from('aplicaciones_pago').select('recibo_id, monto').in('recibo_id', ids) : {data:[]};
  const pagado = {};
  (apl.data || []).forEach(x=>{ pagado[x.recibo_id] = (pagado[x.recibo_id]||0) + Number(x.monto); });
  recibos.forEach(x=>{ x.pagado = pagado[x.id] || 0; x.pendiente = Math.round((Number(x.monto_total) - x.pagado) * 100) / 100; });
  await pTasa;
  datos = {
    saldo: s.data ? Number(s.data.saldo) : 0,
    pendientes: s.data ? Number(s.data.recibos_pendientes) : 0,
    recibos,
    pagos: p.data || [],
    multas: (m.data || []).filter(x=>x.estado !== 'anulada'),
    cargos: c.data || [],
    aportes: ap.data || [],
    aFavor: fav && fav.data ? Number(fav.data.a_favor) : 0,
    datosPago: cfg.data ? (cfg.data.valor || '').trim() : ''
  };
}

async function pintarInicio(){
  raiz.innerHTML = '<div class="vacio" style="padding-top:40vh;">Cargando tu estado de cuenta…</div>';
  try{ await cargar(); }
  catch(e){
    pantallaAviso('No se pudo cargar', 'Hubo un problema al leer tus datos: ' + esc(e.message || e) + '<br>Intenta de nuevo en unos minutos.');
    return;
  }
  const d = datos;
  const debe = d.saldo > 0.005;
  const enRevision = d.pagos.filter(p=>p.estado === 'reportado');
  const sumaRevision = enRevision.reduce((s,p)=>s+Number(p.monto), 0);
  const multasNuevas = d.multas.filter(m=>m.estado === 'pendiente' && !m.recibo_id);

  let h = '<div class="wrap">'
    + '<header><img src="' + LOGO + '" alt=""><div class="t"><b>Apartamento ' + esc(apt.id) + '</b><span>' + esc(apt.propietario || perfil.nombre || '') + '</span></div>'
    + '<button class="menuBtn" id="bMenu" aria-label="Opciones">☰</button></header>'
    + '<div class="menuPop" id="menuPop"><button id="mSalir">↩ Salir</button></div>'
    + multasNuevas.map(m=>'<div class="card aviso">'
        + '<div class="avTit">⚠️ Multa registrada · ' + fecha(m.fecha) + '</div>'
        + '<div class="avTxt">' + (m.articulos_label ? '<b>' + esc(m.articulos_label) + '</b> — ' : '') + esc(m.descripcion) + '</div>'
        + '<div class="avMonto">' + usd(m.monto) + (tasa ? ' <span>· ' + bs(enBs(m.monto)) + '</span>' : '') + '</div>'
        + '<div class="nota">Se sumará a tu próximo recibo de condominio. Si prefieres pagarla antes, reporta el pago: quedará como abono y se descontará de ese recibo.</div>'
        + '</div>').join('')

    + '<div class="card saldo ' + (debe ? 'debe' : 'aldia') + '">'
    + '<div class="lbl">' + (debe ? 'Saldo pendiente' : 'Estás al día') + '</div>'
    + '<div class="monto">' + usd(Math.max(d.saldo, 0)) + '</div>'
    + (debe && tasa ? '<div class="enbs">' + bs(enBs(d.saldo)) + '</div>' : '')
    + '<div class="det">' + (debe
        ? d.pendientes + (d.pendientes === 1 ? ' recibo pendiente' : ' recibos pendientes')
        : 'No tienes recibos pendientes. ¡Gracias!')
    + (sumaRevision > 0 ? '<br><span class="esp">' + usd(sumaRevision) + ' en revisión por la tesorería</span>' : '')
    + (d.aFavor > 0.005 ? '<br><span class="ok">' + usd(d.aFavor) + ' a tu favor (abono): se descontará de tu próximo recibo</span>' : '')
    + '</div>'
    + '<button class="btn" id="bReportar">Reportar un pago</button>'
    + '<div class="nota" style="margin-top:10px;">' + (tasa
        ? 'Tasa BCV: <b>' + f2(tasa.valor) + ' Bs por $</b>' + (tasa.fecha ? ', vigente desde el ' + fecha(String(tasa.fecha).slice(0,10)) : '')
          + '.<br>Si pagas en bolívares, usa la tasa BCV del día en que pagas.'
        : 'Montos en dólares; se pagan en bolívares a la tasa BCV del día del pago. (No se pudo consultar la tasa ahora.)')
    + '</div></div>';

  if(d.datosPago){
    h += '<h2>Datos para pagar</h2><div class="card"><div class="pago-datos">' + esc(d.datosPago) + '</div></div>';
  }

  // recibos
  h += '<h2>Recibos</h2><div class="card lista">' + (d.recibos.length
    ? d.recibos.map(x=>'<div class="fila tap" data-recibo="' + x.id + '"><div class="q"><b>' + mesCorto(x.periodo_id) + '</b>'
        + '<span>' + (x.vence_el ? 'Vence ' + fecha(x.vence_el) : 'Aviso de cobro') + '</span></div>'
        + '<div class="m">' + usd(x.monto_total)
        + (x.pendiente > 0.005
            ? '<small class="mal">' + (x.pagado > 0.005 ? 'falta ' + usd(x.pendiente) : 'pendiente') + '</small>'
              + (tasa ? '<small style="color:var(--dim);font-weight:500;">' + bs(enBs(x.pendiente)) + '</small>' : '')
            : '<small class="ok">✓ pagado</small>')
        + '</div><span style="color:var(--dim);">›</span></div>').join('')
    : '<div class="vacio">Todavía no hay recibos emitidos.</div>') + '</div>';

  // pagos
  const etiqueta = {reportado:['esp','En revisión'], confirmado:['ok','✓ Confirmado'], rechazado:['mal','Rechazado']};
  h += '<h2>Mis pagos</h2><div class="card lista">' + (d.pagos.length
    ? d.pagos.map(p=>{
        const [cls, txt] = etiqueta[p.estado] || ['', p.estado];
        return '<div class="fila"><div class="q"><b>' + fecha(p.fecha) + ' · ' + esc(p.forma_pago || 'Pago') + '</b>'
          + '<span>' + esc([p.banco, p.referencia ? 'Ref. ' + p.referencia : ''].filter(Boolean).join(' · ') || (p.origen === 'portal' ? 'Reportado por ti' : 'Registrado por la tesorería')) + '</span>'
          + (p.estado === 'rechazado' && p.nota ? '<span style="display:block;" class="mal">' + esc(p.nota) + '</span>' : '')
          + '</div><div class="m">' + usd(p.monto) + '<small class="' + cls + '">' + txt + '</small></div></div>';
      }).join('')
    : '<div class="vacio">Aún no hay pagos registrados.</div>') + '</div>';

  // cargos y multas por cobrar
  const porCobrar = d.cargos.map(c=>({fecha:c.fecha, txt:c.concepto, monto:c.monto, tipo:'Cargo'}))
    .concat(multasNuevas.map(m=>({fecha:m.fecha, txt:(m.articulos_label ? m.articulos_label + ' — ' : '') + m.descripcion, monto:m.monto, tipo:'Multa'})));
  if(porCobrar.length){
    h += '<h2>Entran en tu próximo recibo</h2><div class="card lista">'
      + porCobrar.map(x=>'<div class="fila"><div class="q"><b>' + esc(x.txt) + '</b><span>' + x.tipo + ' · ' + fecha(x.fecha) + '</span></div>'
        + '<div class="m">' + usd(x.monto) + '</div></div>').join('') + '</div>';
  }

  // proyectos especiales (Pozo de Agua)
  d.aportes.filter(x=>x.proyectos).forEach(x=>{
    const abonos = (x.proyecto_abonos || []).slice().sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)));
    const abonado = abonos.reduce((s,a)=>s+Number(a.monto), 0);
    const falta = Math.round((Number(x.monto_aporte) - abonado) * 100) / 100;
    h += '<h2>' + esc(x.proyectos.nombre) + '</h2><div class="card">'
      + '<div class="fila" style="padding-top:0;"><div class="q"><b>Tu aporte</b><span>Abonado ' + usd(abonado) + '</span></div>'
      + '<div class="m">' + usd(x.monto_aporte) + (falta > 0.005 ? '<small class="mal">falta ' + usd(falta) + '</small>' : '<small class="ok">✓ completo</small>') + '</div></div>'
      + (abonos.length ? '<details style="margin-top:6px;"><summary class="nota" style="cursor:pointer;">Ver abonos (' + abonos.length + ')</summary><div class="lista" style="padding:4px 0 0;">'
          + abonos.map(a=>'<div class="fila"><div class="q"><b>' + fecha(a.fecha) + '</b><span>' + esc(a.forma_pago || '') + '</span></div><div class="m">' + usd(a.monto) + '</div></div>').join('')
          + '</div></details>' : '')
      + '</div>';
  });

  h += '<p class="nota" style="text-align:center;margin-top:26px;">¿Algo no cuadra? Escríbele a la Junta de Condominio.</p></div>';
  raiz.innerHTML = h;

  const pop = document.getElementById('menuPop');
  document.getElementById('bMenu').onclick = e=>{ e.stopPropagation(); pop.classList.toggle('open'); };
  document.addEventListener('click', ()=>pop.classList.remove('open'));
  document.getElementById('mSalir').onclick = salir;
  document.getElementById('bReportar').onclick = formularioPago;
  raiz.querySelectorAll('[data-recibo]').forEach(f=>{ f.onclick = ()=>verRecibo(f.dataset.recibo); });
}

// ---------- reportar un pago ----------
function formularioPago(){
  const d = datos;
  const proximo = d.cargos.reduce((s,c)=>s+Number(c.monto), 0)
    + d.multas.filter(m=>m.estado === 'pendiente' && !m.recibo_id).reduce((s,m)=>s+Number(m.monto), 0);
  const sugerido = Math.round((Math.max(d.saldo, 0) + proximo - d.aFavor) * 100) / 100;
  abrirHoja('<div class="barra"><b>Reportar un pago</b><button class="cerrar" data-cerrar>✕</button></div>'
    + '<p class="nota" style="margin:0;">La tesorería lo verá en el banco y lo confirmará. Hasta entonces aparece como “En revisión”.</p>'
    + (d.datosPago ? '<details style="margin-top:10px;"><summary class="nota" style="cursor:pointer;">Ver datos para pagar</summary><div class="pago-datos" style="margin-top:6px;">' + esc(d.datosPago) + '</div></details>' : '')
    + '<form id="fPago">'
    + '<label for="pForma">Forma de pago</label><select id="pForma">' + FORMAS_PAGO.map(f=>'<option>' + f + '</option>').join('') + '</select>'
    + (tasa ? '<div id="pFilaBs"><label for="pBs">Monto pagado en bolívares</label><input id="pBs" type="number" inputmode="decimal" step="0.01" min="0.01"'
        + (sugerido > 0.005 ? ' value="' + enBs(sugerido).toFixed(2) + '"' : '') + '>'
        + '<div class="nota" style="margin-top:4px;">A la tasa BCV de ' + f2(tasa.valor) + ' Bs por $.</div></div>' : '')
    + '<label for="pMonto">Equivale en dólares</label><input id="pMonto" type="number" inputmode="decimal" step="0.01" min="0.01" required'
      + (sugerido > 0.005 ? ' value="' + sugerido.toFixed(2) + '"' : '') + '>'
    + '<label for="pFecha">Fecha del pago</label><input id="pFecha" type="date" max="' + hoy() + '" value="' + hoy() + '" required>'
    + '<div class="nota" id="pNotaDivisa" style="display:none;margin-top:6px;">Solo si pagaste en dólares a la <b>cuenta en $</b> del condominio.</div>'
    + '<label for="pBanco">Banco de origen</label><input id="pBanco" type="text" placeholder="Ej.: Banesco">'
    + '<label for="pRef">Número de referencia</label><input id="pRef" type="text" inputmode="numeric" placeholder="El que aparece en el comprobante">'
    + '<label for="pNota">Nota (opcional)</label><textarea id="pNota" placeholder="Algo que la tesorería deba saber"></textarea>'
    + '<div class="error" id="pError"></div>'
    + '<button class="btn" id="pEnviar" style="margin-top:6px;">Enviar reporte</button></form>');

  // bolivares y dolares se calculan entre si con la tasa BCV
  const iBs = document.getElementById('pBs'), iUsd = document.getElementById('pMonto'), selForma = document.getElementById('pForma');
  const enDivisa = ()=>selForma.value.includes('$');
  if(iBs){
    iBs.oninput = ()=>{ const v = parseFloat(iBs.value); iUsd.value = v > 0 ? (Math.round(v / tasa.valor * 100) / 100).toFixed(2) : ''; };
    iUsd.addEventListener('input', ()=>{ const v = parseFloat(iUsd.value); if(!enDivisa()) iBs.value = v > 0 ? enBs(v).toFixed(2) : ''; });
    selForma.onchange = ()=>{
      document.getElementById('pFilaBs').style.display = enDivisa() ? 'none' : '';
      document.querySelector('label[for="pMonto"]').textContent = enDivisa() ? 'Monto en dólares' : 'Equivale en dólares';
      document.getElementById('pNotaDivisa').style.display = enDivisa() ? '' : 'none';
    };
  }

  document.getElementById('fPago').onsubmit = async e=>{
    e.preventDefault();
    const err = document.getElementById('pError');
    const monto = parseFloat(document.getElementById('pMonto').value);
    const forma = document.getElementById('pForma').value;
    const ref = document.getElementById('pRef').value.trim();
    if(!(monto > 0)){ err.textContent = 'Escribe el monto.'; return; }
    if(forma !== 'Efectivo' && !ref){ err.textContent = 'Escribe el número de referencia para que la tesorería lo encuentre.'; return; }
    const dup = datos.pagos.find(p=>p.referencia && ref && p.referencia === ref && p.estado !== 'rechazado');
    if(dup && !confirm('Ya hay un pago con la referencia ' + ref + '. ¿Reportarlo de todos modos?')) return;
    const b = document.getElementById('pEnviar'); b.disabled = true; b.textContent = 'Enviando…';
    const { error } = await db.from('pagos').insert({
      apartamento_id: perfil.apartamento_id,
      fecha: document.getElementById('pFecha').value,
      monto,
      forma_pago: forma,
      banco: document.getElementById('pBanco').value.trim() || null,
      referencia: ref || null,
      nota: [
        iBs && !enDivisa() && parseFloat(iBs.value) > 0 ? 'Pagó ' + bs(parseFloat(iBs.value)) + ' a tasa BCV ' + f2(tasa.valor) : '',
        document.getElementById('pNota').value.trim()
      ].filter(Boolean).join(' · ') || null,
      origen: 'portal',
      estado: 'reportado'
    });
    if(error){
      b.disabled = false; b.textContent = 'Enviar reporte';
      err.textContent = /ux_pago_referencia/.test(error.message)
        ? 'Ya reportaste un pago con esa referencia. Si fue un error, escríbele a la junta.'
        : 'No se pudo enviar: ' + error.message;
      return;
    }
    // avisar a la junta por correo; si falla, el pago igual quedo reportado
    db.functions.invoke('pago-reportado', { body: {} }).catch(()=>{});
    abrirHoja('<div style="text-align:center;padding:20px 8px;"><div style="font-size:44px;">✅</div>'
      + '<h3 style="margin:8px 0 4px;">Pago reportado</h3>'
      + '<p class="nota">La tesorería lo confirmará al verlo en el banco. Puedes seguir su estado en “Mis pagos”.</p>'
      + '<button class="btn" data-cerrar style="margin-top:14px;">Listo</button></div>');
    await pintarInicio();
  };
}

// ---------- ver un recibo ----------
async function verRecibo(id){
  abrirHoja('<div class="barra"><b>Aviso de cobro</b><button class="cerrar" id="rImprimir">🖨️ PDF</button><button class="cerrar" data-cerrar>✕</button></div>'
    + '<div id="reciboHoja">Cargando…</div>');
  document.getElementById('rImprimir').onclick = ()=>window.print();
  try{
    const [r, det, extra, apl] = await Promise.all([
      db.from('recibos').select('*').eq('id', id).single(),
      db.from('recibo_detalle').select('*').eq('recibo_id', id),
      db.rpc('recibo_portal', {p_recibo: id}),
      db.from('aplicaciones_pago').select('monto, pagos(fecha, forma_pago, banco, referencia)').eq('recibo_id', id)
    ]);
    const falla = [r, det, extra, apl].find(x=>x.error);
    if(falla) throw new Error(falla.error.message);
    const rc = r.data;
    const x = datos.recibos.find(y=>y.id === id) || {pagado:0};
    document.getElementById('reciboHoja').innerHTML = htmlRecibo({
      rc, detalle: det.data || [], gastos: extra.data.gastos || [],
      repartido: Number(extra.data.repartido) || 0, pagado: x.pagado, pagos: apl.data || []
    });
  }catch(e){
    document.getElementById('reciboHoja').textContent = 'No se pudo cargar el recibo: ' + (e.message || e);
  }
}

// la misma hoja que imprime la junta (htmlRecibo en index.html)
function htmlRecibo(d){
  const rc = d.rc;
  const totalGastos = d.gastos.reduce((s,g)=>s+Number(g.monto), 0);
  const asiento = Math.round((d.repartido - totalGastos) * 100) / 100;
  const propios = d.detalle.filter(x=>!['condominio', 'ajuste'].includes(x.tipo));
  const comun = d.detalle.filter(x=>['condominio', 'ajuste'].includes(x.tipo)).reduce((s,x)=>s+Number(x.monto), 0);
  const alic = Number(rc.alicuota_aplicada) || 0;
  const saldoRecibo = Number(rc.monto_total) - d.pagado;
  const filasEdificio = d.gastos.length
    ? d.gastos.map(g=>'<tr><td>' + esc(g.descripcion).toUpperCase() + '</td><td class="n">' + f2(g.monto) + '</td></tr>').join('')
      + (Math.abs(asiento) > 0.005 ? '<tr><td>ASIENTO CONTROL DEL PRESUPUESTO ANUAL</td><td class="n">' + f2(asiento) + '</td></tr>' : '')
      + '<tr class="tot"><td>TOTAL GASTOS COMUNES DEL EDIFICIO</td><td class="n">' + f2(d.repartido) + '</td></tr>'
    : d.detalle.map(x=>'<tr><td>' + esc(x.concepto).toUpperCase() + '</td><td class="n">' + f2(x.monto) + '</td></tr>').join('');
  return '<div class="rcCab"><div style="display:flex;align-items:flex-end;gap:12px;">'
    + '<img src="' + LOGO + '" alt="Hatillo Hill · Conjunto Residencial" style="height:64px;width:auto;">'
    + '<div style="font-size:11.5px;color:#555;padding-bottom:4px;">Junta de Condominio<br>Autoadministración</div></div>'
    + '<div class="rcTipo">AVISO DE COBRO<div style="font-size:12px;font-weight:600;">N.º ' + esc(rc.periodo_id) + '-' + esc(rc.apartamento_id) + '</div>' + selloPagado(saldoRecibo)
    + '<div style="font-size:12px;font-weight:400;">Emitido ' + fecha(rc.emitido_en) + (rc.vence_el ? ' · vence ' + fecha(rc.vence_el) : '') + '</div></div></div>'
    + '<div class="rcDatos"><div><b>Propietario:</b> ' + esc(apt.propietario || '') + '</div><div><b>Apto:</b> ' + esc(rc.apartamento_id) + '</div>'
    + '<div><b>Mes:</b> ' + mesLegible(rc.periodo_id) + '</div><div><b>Alícuota:</b> ' + (alic*100).toLocaleString('es-VE', {maximumFractionDigits:6}) + ' %</div></div>'
    + '<table><thead><tr><th>CONCEPTO</th><th class="n">' + (d.gastos.length ? 'GASTOS DEL EDIFICIO $' : 'MONTO $') + '</th></tr></thead><tbody>' + filasEdificio + '</tbody></table>'
    + (d.gastos.length ? '<table><thead><tr><th>SU PARTE</th><th class="n">$</th></tr></thead><tbody>'
        + '<tr><td>Gastos comunes (' + (alic*100).toLocaleString('es-VE', {maximumFractionDigits:4}) + ' % de ' + f2(d.repartido) + ')</td><td class="n">' + f2(comun) + '</td></tr>'
        + propios.map(x=>'<tr><td>' + esc(x.concepto) + '</td><td class="n">' + f2(x.monto) + '</td></tr>').join('')
        + '<tr class="tot"><td>CUOTA DEL MES</td><td class="n">' + f2(rc.monto_total) + '</td></tr></tbody></table>' : '')
    + '<div class="rcPie"><div><b>Saldo anterior</b><span>' + f2(rc.saldo_anterior) + '</span></div>'
    + '<div><b>Cuota del mes</b><span>' + f2(rc.monto_total) + '</span></div>'
    + '<div><b>Pagos aplicados</b><span>' + f2(d.pagado) + '</span></div>'
    + '<div><b>Total adeudado hoy</b><span>' + f2(Math.max(datos.saldo, 0)) + '</span></div></div>'
    + '<div style="margin-top:10px;font-size:11px;color:#555;">' + (saldoRecibo > 0.005 ? 'Este recibo tiene pendientes $' + f2(saldoRecibo) + '.' : 'Este recibo está pagado.')
    + ' Montos en dólares; se pagan en bolívares a la tasa BCV del día del pago.'
    + (tasa && datos.saldo > 0.005 ? ' Hoy, a ' + f2(tasa.valor) + ' Bs por $, el total adeudado equivale a <b>' + bs(enBs(datos.saldo)) + '</b>.' : '')
    + '</div>'
    + htmlPagosRecibo(d.pagos, saldoRecibo);
}

// constancia de pago: cada pago aplicado a este recibo, con su fecha, banco y referencia
function htmlPagosRecibo(pagos, saldoRecibo){
  if(!pagos || !pagos.length) return '';
  const f2p = n=>(Number(n)||0).toLocaleString('es-VE', {minimumFractionDigits:2, maximumFractionDigits:2});
  const fp = s=>s ? new Date(s + 'T12:00:00').toLocaleDateString('es-VE', {day:'2-digit', month:'2-digit', year:'numeric'}) : '';
  const filas = pagos.slice().sort((a,b)=>String((a.pagos||{}).fecha).localeCompare(String((b.pagos||{}).fecha))).map(x=>{
    const p = x.pagos || {};
    return '<tr><td>' + fp(p.fecha) + '</td><td>' + esc(p.forma_pago || '') + '</td><td>' + esc(p.banco || '') + '</td>'
      + '<td>' + esc(p.referencia || '') + '</td><td class="n">' + f2p(x.monto) + '</td></tr>';
  }).join('');
  return '<table style="margin-top:12px;"><thead><tr><th colspan="5">CONSTANCIA DE PAGO' + (saldoRecibo <= 0.005 ? ' — RECIBO PAGADO' : '') + '</th></tr>'
    + '<tr><th>FECHA</th><th>FORMA</th><th>BANCO</th><th>REFERENCIA</th><th class="n">APLICADO $</th></tr></thead><tbody>' + filas
    + '<tr class="tot"><td colspan="4">TOTAL PAGADO DE ESTE RECIBO</td><td class="n">' + f2p(pagos.reduce((s,x)=>s+Number(x.monto), 0)) + '</td></tr></tbody></table>';
}

function selloPagado(saldoRecibo){
  return saldoRecibo <= 0.005
    ? '<div style="display:inline-block;margin-top:4px;padding:2px 10px;border:2px solid #2e7d4f;color:#2e7d4f;border-radius:6px;font-size:13px;font-weight:800;letter-spacing:1px;transform:rotate(-3deg);">PAGADO</div>'
    : '';
}

db.auth.onAuthStateChange(ev=>{ if(ev === 'SIGNED_OUT' && perfil) pantallaLogin(); });
arrancar();
</script>
